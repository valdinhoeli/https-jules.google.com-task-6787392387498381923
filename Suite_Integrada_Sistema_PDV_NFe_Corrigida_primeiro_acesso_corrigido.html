const carregado = {sistema:false,pdv:false};
function decodificarUtf8(b64) {
 const bytes=Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
 return new TextDecoder('utf-8').decode(bytes);
}
function carregar(nome) {
 if(carregado[nome]) return;
 const frame=document.getElementById(nome==='sistema'?'frameSistema':'framePDV');
 frame.srcdoc=decodificarUtf8(APPS[nome]);
 carregado[nome]=true;
}
function mostrar(nome) {
 const sistema=nome==='sistema';
 document.getElementById('frameSistema').classList.toggle('active',sistema);
 document.getElementById('framePDV').classList.toggle('active',!sistema);
 document.getElementById('btnSistema').classList.toggle('active',sistema);
 document.getElementById('btnPDV').classList.toggle('active',!sistema);
 carregar(nome);
}
carregar('sistema');
</script>
<script id="suite-keyboard-shortcuts">
document.addEventListener('keydown',function(e){if(!e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowLeft'){e.preventDefault();mostrar('sistema');document.getElementById('btnSistema').focus();}else if(e.key==='ArrowRight'){e.preventDefault();mostrar('pdv');document.getElementById('btnPDV').focus();}});
</script>
