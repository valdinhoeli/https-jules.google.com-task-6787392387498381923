name: Eli Player 4K APK

on:
  push:
    paths:
      - "iptv-player/**"
      - ".github/workflows/android-iptv-apk.yml"
  pull_request:
    paths:
      - "iptv-player/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iptv-player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes e build
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Eli-Player-4K-apk
          path: iptv-player/app/build/outputs/apk/release/*.apk
